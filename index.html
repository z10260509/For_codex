<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Pixel 9</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #fff;
        }
        header {
            background-color: #fff;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }
        header img {
            max-width: 200px;
        }
        .hero {
            text-align: center;
            padding: 40px 20px;
            background-color: #f2f2f2;
        }
        .hero img {
            max-width: 300px;
            width: 100%;
            height: auto;
        }
        .hero h1 {
            margin: 20px 0 10px;
            font-size: 2em;
        }
        .hero p {
            margin: 0 auto 20px;
            max-width: 600px;
        }
        .btn {
            background-color: #1a73e8;
            color: #fff;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 4px;
            display: inline-block;
        }
        .features {
            padding: 40px 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .features h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .features ul {
            list-style: disc;
            padding-left: 20px;
            line-height: 1.6;
        }
        footer {
            text-align: center;
            padding: 20px;
            border-top: 1px solid #eee;
            font-size: 0.9em;
            color: #555;
        }
    </style>
</head>
<body>
    <header>
        <img src="https://via.placeholder.com/160x30?text=Google+Store" alt="Google Store">
    </header>

    <section class="hero">
        <img src="https://via.placeholder.com/400x400?text=Pixel+9" alt="Pixel 9">
        <h1>Pixel 9</h1>
        <p>體驗 Google AI 與絕佳擷影功能的最新 Pixel 手機。</p>
        <a href="#" class="btn">立即購買</a>
    </section>

    <section class="features">
        <h2>特色</h2>
        <ul>
            <li>強大的 AI 擷影與夜視功能</li>
            <li>具備全天候續航力的電池</li>
            <li>Tensor G 系列晶片提供流暢的效能</li>
        </ul>
    </section>

    <footer>
        這是一個示範頁面，非官方 Google 商店。
    </footer>
</body>
</html>
