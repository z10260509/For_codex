<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Store</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        .container {
            padding: 20px;
        }
        .product {
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin: 10px;
            padding: 15px;
            width: 250px;
            display: inline-block;
            vertical-align: top;
        }
        .product img {
            max-width: 100%;
            height: auto;
        }
        .price {
            color: #b12704;
            font-weight: bold;
        }
        button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <h1>Smartphone Shop</h1>
    </header>
    <div class="container">
        <div class="product">
            <img src="https://via.placeholder.com/200x150" alt="Phone 1">
            <h3>Phone Model A</h3>
            <p class="price">$699</p>
            <p>Powerful phone with amazing features.</p>
            <button>Buy Now</button>
        </div>
        <div class="product">
            <img src="https://via.placeholder.com/200x150" alt="Phone 2">
            <h3>Phone Model B</h3>
            <p class="price">$799</p>
            <p>Sleek design with top-notch performance.</p>
            <button>Buy Now</button>
        </div>
        <div class="product">
            <img src="https://via.placeholder.com/200x150" alt="Phone 3">
            <h3>Phone Model C</h3>
            <p class="price">$899</p>
            <p>Next generation smartphone for tech enthusiasts.</p>
            <button>Buy Now</button>
        </div>
    </div>
</body>
</html>
